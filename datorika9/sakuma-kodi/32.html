<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; background-color: #f8fafc; color: #1e293b; }
.panelis { background-color: #ffffff; border: 2px solid #cbd5e1; border-radius: 12px; padding: 18px; margin: 16px 0; }
label { display: block; font-weight: bold; margin-top: 10px; }
button, input { font: inherit; padding: 10px 14px; margin: 6px 0; }
input { display: block; width: 100%; max-width: 280px; box-sizing: border-box; }
button { cursor: pointer; background-color: #245b91; color: #ffffff; border: 0; border-radius: 8px; margin-top: 12px; }
#atbilde { font-size: 18px; font-weight: bold; margin: 14px 0 4px; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Spēlētāja punktu aprēķins</h1>
<!-- 2. un 3. UZDEVUMS: šeit zem virsraksta pievieno <p id="noteikumi"> rindkopu ar punktu noteikumiem -->
<div class="panelis">
  <label for="vards">Spēlētāja vārds</label>
  <input id="vards" value="Spēlētājs">

  <label for="skaits">Savākto zvaigžņu skaits</label>
  <input id="skaits" type="number" min="0" value="2">

  <button onclick="paradit()">Aprēķināt punktus</button>
  <p id="atbilde">Nospied pogu, lai redzētu rezultātu.</p>
</div>
<script>
// Funkcija izpildās katru reizi, kad spēlētājs nospiež pogu.
function paradit() {
  // === GATAVĀ DAĻA — nolasa abus ievades laukus (nemaini) ===
  const vards = document.getElementById("vards").value;
  const skaits = Number(document.getElementById("skaits").value);

  // === 2. un 3. UZDEVUMS — MAINI ŠEIT: punktu aprēķina formula ===
  const punkti = skaits * 5;

  // === GATAVĀ DAĻA — parāda aprēķināto atbildi lapā ===
  document.getElementById("atbilde").textContent = vards + ": " + punkti + " punkti";
}
</script>
</body>
</html>
