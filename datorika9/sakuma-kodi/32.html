<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }

</style>
</head>
<body>
<h1>Spēlētāja dati</h1>
<label for="vards">Spēlētāja vārds</label>
<input id="vards" value="Spēlētājs">
<label for="skaits">Savākto zvaigžņu skaits</label>
<input id="skaits" type="number" min="0" value="2">
<button onclick="paradit()">Parādīt rezultātu</button>
<p id="atbilde">Nospied pogu.</p>
<script>
// Gatava funkcija: poga izpilda rindas starp figūriekavām.
function paradit() {
  const vards = document.getElementById("vards").value;
  const skaits = Number(document.getElementById("skaits").value);
  const punkti = skaits * 5;
  document.getElementById("atbilde").textContent = vards + ": " + punkti + " punkti";
}
</script>
</body>
</html>
