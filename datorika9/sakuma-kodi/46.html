<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
/* Pamata izkārtojums un laukuma pozicionēšana — izmērus un position nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; background-color: #f8fafc; color: #1e293b; }
/* 1. UZDEVUMS: drīksti pielāgot #laukums, #speletajs un #pretinieks krāsas */
#laukums { position: relative; width: 300px; height: 220px; max-width: 100%; margin: 14px 0; background: #edf5ff; outline: 2px solid #245b91; border-radius: 4px; overflow: hidden; }
#speletajs, #pretinieks { position: absolute; width: 30px; height: 30px; border-radius: 4px; }
#speletajs { background: #245b91; left: 20px; top: 160px; }
#pretinieks { background: #b3261e; left: 270px; top: 160px; }
button { font: inherit; padding: 10px 14px; margin: 4px 6px 4px 0; cursor: pointer; background-color: #245b91; color: #ffffff; border: 0; border-radius: 8px; }
button.secondary { background-color: #475569; }
#punkti { font-size: 18px; font-weight: bold; }
#stavoklis { font-size: 17px; font-weight: bold; color: #1e3a8a; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Izvairies no pretinieka</h1>
<p id="noteikumi">Ar pogām vai tastatūras bultiņām vadi kvadrātu un neļauj pretiniekam trāpīt!</p>

<div id="laukums">
  <div id="speletajs"></div>
  <div id="pretinieks"></div>
</div>

<button id="sakt">Sākt</button>
<button id="paKreisi">←</button>
<button id="paLabi">→</button>
<button id="uzAugsu">↑</button>
<button id="uzLeju">↓</button>
<button class="secondary" id="atjaunot">Sākt no jauna</button>

<p id="punkti">Punkti: 0</p>
<p id="stavoklis">Nospied Sākt, lai sāktu spēli.</p>

<script>
// === 1. UZDEVUMS — MAINI ŠEIT: spēlētāja solis (10–25) un pretinieka ātrums (2–5) ===
const solis = 10;
const pretiniekaAtrums = 3;

// === SPĒLES STĀVOKĻA ATMIŅA ===
let x = 20;
let y = 160;
let pretiniekaX = 270;
let punkti = 0;
let aktiva = false;
let taimeris = null;

const speletajs = document.getElementById("speletajs");
const pretinieks = document.getElementById("pretinieks");

// === ELEMENTU UN PUNKTU ATTĒLOŠANA ===
function paradit() {
  speletajs.style.left = x + "px";
  speletajs.style.top = y + "px";
  pretinieks.style.left = pretiniekaX + "px";
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}

// === 2. UZDEVUMS — PAPILDINI ŠEIT: izmanto parametru daudzums fiksētā skaitļa 1 vietā ===
function pieskaititPunktus(daudzums) {
  punkti = punkti + 1;
}

// === GATAVĀ PĀRKLĀŠANĀS FORMULA (šo funkciju nemaini) ===
function saduras(a, b) {
  const p = a.getBoundingClientRect();
  const q = b.getBoundingClientRect();
  return p.left < q.right && p.right > q.left &&
         p.top < q.bottom && p.bottom > q.top;
}

// === SADURSMES SEKU FUNKCIJA ===
function parbaudit() {
  if (saduras(speletajs, pretinieks)) {
    aktiva = false;
    clearInterval(taimeris);
    // 2. UZDEVUMS: uzstādi speletajs.style.backgroundColor un pielāgo savu beigu ziņu
    document.getElementById("stavoklis").textContent = "Sadursme! Spēle beigusies.";
  }
}

// === SPĒLĒTĀJA KUSTĪBA AR LAUKUMA ROBEŽĀM ===
function kustinat(dx, dy) {
  if (!aktiva) { return; }
  x = x + dx * solis;
  y = y + dy * solis;
  const laukums = document.getElementById("laukums");
  x = Math.max(0, Math.min(laukums.clientWidth - 30, x));
  y = Math.max(0, Math.min(laukums.clientHeight - 30, y));
  paradit();
  parbaudit();
}

// === PRETINIEKA AUTOMĀTISKAIS SOLIS UN APĻA PUNKTI ===
function cikls() {
  pretiniekaX = pretiniekaX - pretiniekaAtrums;
  if (pretiniekaX < 0) {
    pretiniekaX = document.getElementById("laukums").clientWidth - 30;
    // 2. UZDEVUMS: izsauc pieskaititPunktus(5), lai katrs aplis dotu 5 punktus
    pieskaititPunktus(1);
  }
  paradit();
  parbaudit();
}

// === SPĒLES SĀKŠANA UN SĀKŠANA NO JAUNA ===
function sakt() {
  if (aktiva) { return; }
  x = 20;
  y = 160;
  pretiniekaX = document.getElementById("laukums").clientWidth - 30;
  punkti = 0;
  aktiva = true;
  // 2. UZDEVUMS: notīri JavaScript uzlikto sadursmes krāsu ar ""
  document.getElementById("stavoklis").textContent = "Spēle notiek — izvairies!";
  clearInterval(taimeris);
  paradit();
  taimeris = setInterval(cikls, 30);
}

function saktNoJauna() {
  aktiva = false;
  clearInterval(taimeris);
  taimeris = null;
  x = 20;
  y = 160;
  pretiniekaX = document.getElementById("laukums").clientWidth - 30;
  punkti = 0;
  // 2. UZDEVUMS: arī šeit notīri JavaScript uzlikto sadursmes krāsu ar ""
  document.getElementById("stavoklis").textContent = "Nospied Sākt, lai sāktu spēli.";
  paradit();
}

// === POGU UN TASTATŪRAS KLAUSĪTĀJI ===
document.getElementById("sakt").addEventListener("click", sakt);
document.getElementById("paKreisi").addEventListener("click", function () { kustinat(-1, 0); });
document.getElementById("paLabi").addEventListener("click", function () { kustinat(1, 0); });
document.getElementById("uzAugsu").addEventListener("click", function () { kustinat(0, -1); });
document.getElementById("uzLeju").addEventListener("click", function () { kustinat(0, 1); });
document.getElementById("atjaunot").addEventListener("click", saktNoJauna);

document.addEventListener("keydown", function (notikums) {
  if (notikums.key === "ArrowLeft") { notikums.preventDefault(); kustinat(-1, 0); }
  if (notikums.key === "ArrowRight") { notikums.preventDefault(); kustinat(1, 0); }
  // 1. UZDEVUMS: pievieno "ArrowUp" un "ArrowDown" ar notikums.preventDefault()
});

paradit();
</script>
</body>
</html>
