<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; background-color: #f8fafc; color: #1e293b; }
.panelis { background-color: #ffffff; border: 2px solid #cbd5e1; border-radius: 12px; padding: 18px; margin: 16px 0; }
.panelis p { margin: 8px 0; }
#soma { font-size: 18px; font-weight: bold; }
button { font: inherit; padding: 10px 14px; margin-top: 10px; cursor: pointer; background-color: #245b91; color: #ffffff; border: 0; border-radius: 8px; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Spēlētāja soma</h1>
<div class="panelis">
  <p id="soma"></p>
  <!-- 3. UZDEVUMS: šeit pievieno <p id="pirmais"></p> pirmā priekšmeta parādīšanai -->
  <p id="skaits"></p>
  <!-- 2. UZDEVUMS: pielāgo pogas uzrakstu savam jaunajam priekšmetam -->
  <button onclick="pievienot()">Paņemt atslēgu</button>
</div>
<script>
// === 1. UZDEVUMS — MAINI ŠEIT: ieraksti 3 savas spēles sākuma priekšmetus ===
const manta = ["karte", "lukturis"];

// Funkcija atjauno somas saturu un skaitu lapā.
function paradit() {
  document.getElementById("soma").textContent = "Somā ir: " + manta.join(", ");
  document.getElementById("skaits").textContent = "Priekšmetu skaits: " + manta.length;
  // === 3. UZDEVUMS — PAPILDINI ŠEIT: parādi pirmo priekšmetu elementā "pirmais" ===
}

// Funkcija izpildās, kad spēlētājs nospiež pogu.
function pievienot() {
  // === 2. UZDEVUMS — MAINI ŠEIT: kuru priekšmetu pievieno poga ===
  manta.push("atslēga");
  paradit();
}

// === GATAVĀ DAĻA — parāda sākuma sarakstu uzreiz pēc lapas atvēršanas (nemaini) ===
paradit();
</script>
</body>
</html>
