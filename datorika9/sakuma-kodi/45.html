<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
/* Pamata izkārtojums un laukuma pozicionēšana — izmērus un position nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; background-color: #f8fafc; color: #1e293b; }
#laukums { position: relative; width: 300px; height: 220px; max-width: 100%; margin: 14px 0; background: #edf5ff; outline: 2px solid #245b91; border-radius: 4px; overflow: hidden; }
#speletajs, #pretinieks, #moneta { position: absolute; width: 30px; height: 30px; }
/* 1. UZDEVUMS: drīksti mainīt #speletajs sākuma krāsu (background) un noapaļojumu */
#speletajs { background: #245b91; left: 20px; top: 160px; border-radius: 4px; }
#pretinieks { background: #b3261e; left: 270px; top: 160px; border-radius: 4px; }
#moneta { background: #ffca28; left: 140px; top: 160px; border-radius: 50%; }
button { font: inherit; padding: 10px 14px; margin: 4px 6px 4px 0; cursor: pointer; background-color: #245b91; color: #ffffff; border: 0; border-radius: 8px; }
button.secondary { background-color: #475569; }
#stavoklis { font-size: 18px; font-weight: bold; color: #1e3a8a; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Sadursmes pārbaude</h1>
<p id="noteikumi">Nospied Sākt un ar pogām vai bultiņām izvairies no pretinieka.</p>

<div id="laukums">
  <div id="speletajs"></div>
  <div id="pretinieks"></div>
</div>

<button id="sakt">Sākt</button>
<button id="paKreisi">←</button>
<button id="paLabi">→</button>
<button id="uzAugsu">↑</button>
<button id="uzLeju">↓</button>
<button class="secondary" id="atjaunot">Atiestatīt</button>

<p id="stavoklis">Nospied Sākt, lai palaistu pretinieku.</p>

<script>
// === SPĒLES STĀVOKĻA MAINĪGIE ===
let x = 20;
let y = 160;
let pretiniekaX = 270;
let aktiva = false;
let taimeris = null;
const solis = 10;
const pretiniekaAtrums = 3;

const speletajs = document.getElementById("speletajs");
const pretinieks = document.getElementById("pretinieks");

// === ELEMENTU ATTĒLOŠANAS FUNKCIJA ===
function paradit() {
  speletajs.style.left = x + "px";
  speletajs.style.top = y + "px";
  pretinieks.style.left = pretiniekaX + "px";
}

// === GATAVĀ PĀRKLĀŠANĀS FORMULA (šo funkciju nemaini) ===
function saduras(a, b) {
  const p = a.getBoundingClientRect();
  const q = b.getBoundingClientRect();
  return p.left < q.right && p.right > q.left &&
         p.top < q.bottom && p.bottom > q.top;
}

// === SADURSMES SEKU FUNKCIJA ===
function parbaudit() {
  // 2. UZDEVUMS: ja saduras(speletajs, pretinieks) ir patiess,
  // uzstādi aktiva = false, apturi taimeri, nomaini spēlētāja krāsu un #stavoklis tekstu
}

// === SPĒLĒTĀJA KUSTĪBA ===
function kustinat(dx, dy) {
  if (!aktiva) { return; }
  x = x + dx * solis;
  y = y + dy * solis;
  const laukums = document.getElementById("laukums");
  x = Math.max(0, Math.min(laukums.clientWidth - 30, x));
  y = Math.max(0, Math.min(laukums.clientHeight - 30, y));
  paradit();
  // 2. UZDEVUMS: šeit izsauc parbaudit()
}

// === PRETINIEKA AUTOMĀTISKAIS SOLIS ===
function cikls() {
  pretiniekaX = pretiniekaX - pretiniekaAtrums;
  if (pretiniekaX < 0) {
    pretiniekaX = document.getElementById("laukums").clientWidth - 30;
  }
  paradit();
  // 2. UZDEVUMS: šeit izsauc parbaudit()
}

// === SPĒLES SĀKŠANA UN ATIESTATĪŠANA ===
function sakt() {
  if (aktiva) { return; }
  x = 20;
  y = 160;
  pretiniekaX = document.getElementById("laukums").clientWidth - 30;
  aktiva = true;
  // 3. UZDEVUMS: šeit notīri JavaScript uzlikto spēlētāja krāsu ar ""
  document.getElementById("stavoklis").textContent = "Spēle notiek — izvairies!";
  clearInterval(taimeris);
  paradit();
  taimeris = setInterval(cikls, 30);
}

function atiestatit() {
  aktiva = false;
  clearInterval(taimeris);
  taimeris = null;
  x = 20;
  y = 160;
  pretiniekaX = document.getElementById("laukums").clientWidth - 30;
  // 3. UZDEVUMS: arī šeit notīri JavaScript uzlikto spēlētāja krāsu ar ""
  document.getElementById("stavoklis").textContent = "Nospied Sākt, lai palaistu pretinieku.";
  paradit();
}

// === POGU UN TASTATŪRAS KLAUSĪTĀJI (šo daļu nemaini) ===
document.getElementById("sakt").addEventListener("click", sakt);
document.getElementById("paKreisi").addEventListener("click", function () { kustinat(-1, 0); });
document.getElementById("paLabi").addEventListener("click", function () { kustinat(1, 0); });
document.getElementById("uzAugsu").addEventListener("click", function () { kustinat(0, -1); });
document.getElementById("uzLeju").addEventListener("click", function () { kustinat(0, 1); });
document.getElementById("atjaunot").addEventListener("click", atiestatit);
document.addEventListener("keydown", function (notikums) {
  if (notikums.key === "ArrowLeft") { notikums.preventDefault(); kustinat(-1, 0); }
  if (notikums.key === "ArrowRight") { notikums.preventDefault(); kustinat(1, 0); }
  if (notikums.key === "ArrowUp") { notikums.preventDefault(); kustinat(0, -1); }
  if (notikums.key === "ArrowDown") { notikums.preventDefault(); kustinat(0, 1); }
});
paradit();
</script>
</body>
</html>
