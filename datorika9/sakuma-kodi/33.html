<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; background-color: #f8fafc; color: #1e293b; }
.panelis { background-color: #ffffff; border: 2px solid #cbd5e1; border-radius: 12px; padding: 18px; margin: 16px 0; }
label { display: block; font-weight: bold; margin-top: 6px; }
button, input { font: inherit; padding: 10px 14px; margin: 6px 0; }
input { display: block; width: 100%; max-width: 240px; box-sizing: border-box; }
button { cursor: pointer; background-color: #245b91; color: #ffffff; border: 0; border-radius: 8px; margin-top: 10px; }
#atbilde { font-size: 18px; font-weight: bold; margin: 14px 0 4px; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Pārbaudi punktus</h1>
<!-- 3. UZDEVUMS: šeit zem virsraksta pievieno <p id="noteikumi"> rindkopu ar uzvaras mērķi -->
<div class="panelis">
  <label for="skaits">Punkti</label>
  <input id="skaits" type="number" value="0">
  <button onclick="parbaudit()">Pārbaudīt</button>
  <p id="atbilde">Ievadi punktus un nospied pogu.</p>
</div>
<script>
function parbaudit() {
  // === GATAVĀ DAĻA — nolasa ievadīto punktu skaitu (nemaini) ===
  const punkti = Number(document.getElementById("skaits").value);
  let zina = "";

  // === 2. un 3. UZDEVUMS — MAINI ŠEIT: punktu pārbaude ar if / else if / else ===
  if (punkti >= 10) {
    zina = "Uzvara!";
  } else {
    zina = "Turpini spēli!";
  }

  // === GATAVĀ DAĻA — parāda izvēlēto ziņu lapā (nemaini) ===
  document.getElementById("atbilde").textContent = zina;
}
</script>
</body>
</html>
