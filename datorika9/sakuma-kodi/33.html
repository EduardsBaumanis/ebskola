<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }

</style>
</head>
<body>
<h1>Pārbaudi punktus</h1>
<label for="skaits">Punkti</label>
<input id="skaits" type="number" value="0">
<button onclick="parbaudit()">Pārbaudīt</button>
<p id="atbilde">Ievadi punktus un nospied pogu.</p>
<script>
function parbaudit() {
  const punkti = Number(document.getElementById("skaits").value);
  let zina = "";
  if (punkti >= 10) {
    zina = "Uzvara!";
  } else {
    zina = "Turpini spēli!";
  }
  document.getElementById("atbilde").textContent = zina;
}
</script>
</body>
</html>
