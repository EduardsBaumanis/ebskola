<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }

</style>
</head>
<body>
<h1 id="nosaukums">Mana spēle</h1>
<p id="punkti">Punkti: 0</p>
<p id="dzivibas">Dzīvības: 0</p>
<script>
// MAINI ŠEIT: spēles dati.
const nosaukums = "Zvaigžņu mednieks";
let punkti = 0;
let dzivibas = 3;

// ŠEIT APRĒĶINS

// Gatavās rindas parāda vērtības lapā.
document.getElementById("nosaukums").textContent = nosaukums;
document.getElementById("punkti").textContent = "Punkti: " + punkti;
document.getElementById("dzivibas").textContent = "Dzīvības: " + dzivibas;
</script>
</body>
</html>
