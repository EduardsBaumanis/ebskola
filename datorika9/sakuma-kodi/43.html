<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
#laukums { position: relative; width: 300px; height: 220px; max-width: 100%; background: #edf5ff; outline: 2px solid #245b91; overflow: hidden; }
#speletajs, #pretinieks, #moneta { position: absolute; width: 30px; height: 30px; }
#speletajs { background: #245b91; left: 20px; top: 160px; }
#pretinieks { background: #b3261e; left: 220px; top: 160px; }
#moneta { background: #ffca28; left: 140px; top: 160px; border-radius: 50%; }
</style>
</head>
<body>
<h1>Spēles koordinātes</h1>
<p>Vadi kvadrātu ar pogām.</p>
<div id="laukums"><div id="speletajs"></div></div>
<button onclick="kustinat(-10, 0)">←</button>
<button onclick="kustinat(10, 0)">→</button>
<!-- ŠEIT VERTIKĀLĀS POGAS -->
<p id="vieta"></p>
<script>
let x = 20;
let y = 160;
function paradit() {
  const speletajs = document.getElementById("speletajs");
  speletajs.style.left = x + "px";
  speletajs.style.top = y + "px";
  document.getElementById("vieta").textContent = "X: " + x + ", Y: " + y;
}
function kustinat(dx, dy) {
  x = x + dx;
  y = y + dy;
  // Gatavas robežas abiem virzieniem.
  const laukums = document.getElementById("laukums");
  x = Math.max(0, Math.min(laukums.clientWidth - 30, x));
  y = Math.max(0, Math.min(laukums.clientHeight - 30, y));
  paradit();
}
paradit();
</script>
</body>
</html>
