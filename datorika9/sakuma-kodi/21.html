<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 8px 0; cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }

/* MAINI ŠEIT: lapas krāsas un teksts */
body {
  background-color: #ffffff;
  color: #222222;
}

h1 {
  color: #245b91;
  font-size: 32px;
}

.noteikumi {
  background-color: #eeeeee;
  color: #222222;
  padding: 12px;
}

button {
  background-color: #245b91;
  color: #ffffff;
  border: 0;
}
</style>
</head>
<body>
<h1>Mana spēle</h1>
<p>Īss spēles mērķa apraksts.</p>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Savāc piecas zvaigznes.</p>
</section>
<button>Sākt spēli</button>
</body>
</html>
