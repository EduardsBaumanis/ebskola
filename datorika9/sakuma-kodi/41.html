<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }

</style>
</head>
<body>
<h1>Punktu pogas</h1>
<p id="punkti">Punkti: 0</p>
<button onclick="pieskaitit(1)">+1 punkts</button>
<!-- ŠEIT OTRĀ POGA -->
<button onclick="saktNoJauna()">Sākt no jauna</button>
<script>
let punkti = 0;
function paradit() {
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
function pieskaitit(skaits) {
  punkti = punkti + skaits;
  paradit();
}
function saktNoJauna() {
  punkti = 0;
  paradit();
}
</script>
</body>
</html>
