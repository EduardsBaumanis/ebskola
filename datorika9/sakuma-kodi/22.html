<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
input { font: inherit; padding: 10px; margin: 4px; }
img { max-width: 100%; height: auto; }
.laukums p { margin: 0 0 8px 0; }
[hidden] { display: none !important; }

/* MAINI ŠEIT: spēles laukums un atstarpes */
h1 {
  color: #245b91;
}

.laukums {
  width: 280px;
  height: 200px;
  padding: 8px;
  border: 3px solid #245b91;
  background-color: #e7f2fc;
  box-sizing: border-box;
}

button {
  font: inherit;
  padding: 8px 12px;
  margin: 4px;
  background-color: #245b91;
  color: #ffffff;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>
<body>
<h1>Spēles laukums</h1>
<div class="laukums">
  <p>Šeit būs spēle.</p>
</div>
<button>Sākt</button>
<button>Noteikumi</button>
</body>
</html>
